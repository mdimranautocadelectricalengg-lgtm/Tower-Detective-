name: Build Tower Detective

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Copy native Tower Detector plugin
        run: |
          mkdir -p android/app/src/main/java/com/towerdetective/app
          cp native/TowerDetectorPlugin.java \
             android/app/src/main/java/com/towerdetective/app/TowerDetectorPlugin.java

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = path.read_text()

          permissions = """
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
          <uses-permission android:name="android.permission.READ_PHONE_STATE"/>
          """

          if "ACCESS_FINE_LOCATION" not in text:
              text = text.replace(
                  "<manifest",
                  "<manifest" + permissions,
                  1
              )

          path.write_text(text)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Gradle wrapper
        run: |
          ls -la android
          test -f android/gradlew
          chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build Release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Show APK
        run: |
          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Show AAB
        run: |
          find android/app/build/outputs/bundle \
            -type f \
            -name "*.aab" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tower-Detective-APK
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Tower-Detective-AAB
          path: android/app/build/outputs/bundle/release/*.aab
