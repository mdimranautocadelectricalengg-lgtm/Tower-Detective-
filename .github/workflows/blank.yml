name: Build Tower Detective

on:
  workflow_dispatch:

  push:
    branches:
      - main


jobs:

  build:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      - name: Install dependencies
        run: npm install


      - name: Create Android project
        run: npx cap add android


      - name: Install native Tower Detective files
        run: |

          mkdir -p \
          android/app/src/main/java/com/towerdetective/app

          cp native/TowerDetectorPlugin.java \
          android/app/src/main/java/com/towerdetective/app/

          cp native/MainActivity.java \
          android/app/src/main/java/com/towerdetective/app/


      - name: Add Android permissions
        run: |

          python3 - <<'PY'

          path = "android/app/src/main/AndroidManifest.xml"

          text = open(path).read()

          permissions = """
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
          <uses-permission android:name="android.permission.READ_PHONE_STATE"/>
          """

          text = text.replace(
              "<application",
              permissions + "\n<application",
              1
          )

          open(path,"w").write(text)

          PY


      - name: Sync Capacitor
        run: npx cap sync android


      - name: Make Gradle executable
        run: chmod +x android/gradlew


      - name: Build Debug APK
        run: |

          cd android

          ./gradlew assembleDebug


      - name: Build Release AAB
        run: |

          cd android

          ./gradlew bundleRelease


      - name: Show APK and AAB
        run: |

          echo "===== APK ====="

          find android/app/build/outputs/apk \
          -type f \
          -name "*.apk"

          echo "===== AAB ====="

          find android/app/build/outputs/bundle \
          -type f \
          -name "*.aab"


      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: Tower-Detective-APK

          path:
            android/app/build/outputs/apk/debug/*.apk

          if-no-files-found: error


      - name: Upload AAB
        uses: actions/upload-artifact@v4

        with:

          name: Tower-Detective-AAB

          path:
            android/app/build/outputs/bundle/release/*.aab

          if-no-files-found: error
